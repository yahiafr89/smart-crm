<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title data-i18n="dashboard.pageTitle">
        Clients - Smart CRM
    </title>

    <link
        rel="stylesheet"
        href="CSS/style.css"
    >
    <link rel="stylesheet" href="CSS/premium-light.css" data-smartcrm-premium-light="1">
</head>

<body class="crm-app-body">

    <div class="crm-app-shell">

        <aside class="crm-sidebar">

            <div class="crm-sidebar-top">

                <a
                    href="dashboard.html"
                    class="crm-brand"
                    aria-label="Smart CRM"
                >

                    <span
                        class="brand-mark"
                        aria-hidden="true"
                    >

                        <svg
                            viewBox="0 0 32 32"
                            role="img"
                            focusable="false"
                        >
                            <path d="M7 22.5V17.5M16 22.5V12.5M25 22.5V7.5"></path>
                            <path d="M6.5 9.5L13 7L18.5 9.5L26 4.5"></path>

                            <circle cx="6.5" cy="9.5" r="1.8"></circle>
                            <circle cx="13" cy="7" r="1.8"></circle>
                            <circle cx="18.5" cy="9.5" r="1.8"></circle>
                            <circle cx="26" cy="4.5" r="1.8"></circle>
                        </svg>

                    </span>

                    <span class="crm-brand-text">

                        <strong>
                            Smart CRM
                        </strong>

                        <small>
                            Workspace
                        </small>

                    </span>

                </a>

                <nav
                    class="crm-sidebar-nav"
                    aria-label="Navigation principale"
                    data-i18n-aria-label="nav.mainLabel"
                >

                    <a
                        href="dashboard.html"
                    >

                        <span
                            class="crm-nav-icon"
                            aria-hidden="true"
                        >
                            ▦
                        </span>

                        <span data-i18n="nav.dashboard">
                            Tableau de bord
                        </span>

                    </a>

                    <a href="prospects.html">

                        <span
                            class="crm-nav-icon"
                            aria-hidden="true"
                        >
                            ◇
                        </span>

                        <span data-i18n="nav.prospects">
                            Prospects
                        </span>

                    </a>

                    <a href="clients.html" class="active" aria-current="page"><span class="crm-nav-icon" aria-hidden="true">▤</span><span>Clients</span></a>

                    <a href="commerciaux.html">

                        <span
                            class="crm-nav-icon"
                            aria-hidden="true"
                        >
                            ♙
                        </span>

                        <span data-i18n="nav.salespeople">
                            Commerciaux
                        </span>

                    </a>

                    <a href="administration.html">

                        <span
                            class="crm-nav-icon"
                            aria-hidden="true"
                        >
                            ⚙
                        </span>

                        <span data-i18n="nav.administration">
                            Administration
                        </span>

                    </a>

                </nav>

            </div>

            <div class="crm-sidebar-bottom">

                <div class="crm-user-card">

                    <span
                        class="crm-user-avatar"
                        aria-hidden="true"
                    >
                        DM
                    </span>

                    <div class="crm-user-meta">

                        <strong>
                            Compte démo
                        </strong>

                        <span>
                            Administrator
                        </span>

                    </div>

                    <button
                        type="button"
                        class="crm-user-menu-button"
                        aria-label="Options utilisateur"
                    >
                        •••
                    </button>

                </div>

            </div>

        </aside>

        <div class="crm-app-main">

            <header class="crm-topbar">

                <div class="crm-topbar-title">

                    <span
                        class="crm-topbar-eyebrow"
                        
                    >
                        Customer directory
                    </span>

                    <h1>
                        Clients
                    </h1>

                </div>

                <div class="crm-topbar-actions">

                    <div
                        class="language-selector"
                        aria-label="Choix de la langue"
                        data-i18n-aria-label="language.selectorLabel"
                    >

                        <button
                            type="button"
                            id="lang-fr"
                            data-i18n="language.french"
                            aria-label="Français"
                        >
                            🇫🇷 Français
                        </button>

                        <button
                            type="button"
                            id="lang-en"
                            data-i18n="language.english"
                            aria-label="English"
                        >
                            🇬🇧 English
                        </button>

                    </div>

                    <a
                        href="prospects.html"
                        class="btn-primary crm-new-prospect-button"
                        data-i18n="dashboard.newProspect"
                    >
                        + Nouveau prospect
                    </a>

                </div>

            </header>

            <main class="dashboard crm-dashboard-main"><div class="crm-clients-live"><p>Loading clients…</p></div></main>

        </div>

    </div>

    <script>window.SMARTCRM_CONNECTED_MODE = true; document.documentElement.style.visibility = "hidden";</script>
    <script src="JS/script.js"></script>
    <script type="module" src="JS/api/auth-page.js"></script>

</body>

</html>
