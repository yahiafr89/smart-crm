<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title data-i18n="login.pageTitle">
        Smart CRM - Connexion
    </title>

    <link
        rel="stylesheet"
        href="CSS/style.css"
    >

</head>

<body class="login-page">

    <main class="login-container">

        <section
            class="login-card"
            aria-labelledby="login-title"
        >

            <div
                class="language-selector"
                aria-label="Choix de la langue"
                data-i18n-aria-label="language.selectorLabel"
            >

                <button
                    type="button"
                    id="lang-fr"
                    data-i18n="language.french"
                    aria-label="Français"
                >
                    🇫🇷 Français
                </button>

                <button
                    type="button"
                    id="lang-en"
                    data-i18n="language.english"
                    aria-label="English"
                >
                    🇬🇧 English
                </button>

            </div>

            <div class="login-header">

                <h1 id="login-title">
                    Smart CRM
                </h1>

                <p data-i18n="login.subtitle">
                    Connectez-vous pour accéder à votre espace.
                </p>

            </div>

            <form
                class="login-form"
                id="login-form"
                novalidate
            >

                <div class="form-group">

                    <label
                        for="email"
                        data-i18n="login.email"
                    >
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="vous@entreprise.com"
                        data-i18n-placeholder="login.emailPlaceholder"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label
                        for="password"
                        data-i18n="login.password"
                    >
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Votre mot de passe"
                        data-i18n-placeholder="login.passwordPlaceholder"
                        autocomplete="current-password"
                        required
                        minlength="6"
                    >

                </div>

                <p
                    id="login-error"
                    class="form-error"
                    role="alert"
                    aria-live="polite"
                    hidden
                ></p>

                <button
                    type="submit"
                    class="btn-primary"
                    data-i18n="login.submit"
                >
                    Se connecter
                </button>

            </form>

            <div class="login-footer">

                <p data-i18n="login.authorizedUsers">
                    Espace réservé aux utilisateurs autorisés.
                </p>

            </div>

        </section>

    </main>

    <script src="JS/script.js"></script>

</body>

</html>
